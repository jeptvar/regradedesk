name: second-shelf-dev
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-dev-only
      MARIADB_ROOT_PASSWORD: local-root-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: ${SECOND_SHELF_WP_IMAGE:-wordpress:7.1.3-php8.3-apache}
    ports:
      - '127.0.0.1:8097:80'
    environment: &wp-environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-dev-only
      WORDPRESS_DB_NAME: wordpress
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - .:/var/www/html/wp-content/plugins/second-shelf
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-php8.3
    entrypoint: [wp]
    user: '33:33'
    environment: *wp-environment
    volumes: *wp-volumes
    depends_on:
      - wordpress
volumes:
  db:
  wordpress:
