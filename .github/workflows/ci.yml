name: Plugin checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: plugin-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: current
            wordpress: wordpress:7.1.3-php8.3-apache
            woocommerce: '11.2.1'
          - stack: baseline
            wordpress: wordpress:6.9.4-php8.3-apache
            woocommerce: '10.7.0'
    env:
      SECOND_SHELF_WP_IMAGE: ${{ matrix.wordpress }}
      SECOND_SHELF_WC_VERSION: ${{ matrix.woocommerce }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
      - name: PHP syntax
        run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm ci
      - name: Integration on legacy orders and HPOS
        run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: second-shelf-plugin-${{ matrix.stack }}
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.stack }}
          path: |
            artifacts/*.png
            artifacts/browser-results.json
      - name: Stop test containers
        if: always()
        run: docker compose down
